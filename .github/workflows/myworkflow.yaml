name: My_WorkFlow_1

on:
  push:
  workflow_dispatch:

jobs:
  myjob1:
    runs-on: ubuntu-latest

    steps:
      - name: Step1- 
        run: |
          whoami
          pwd

      - name: Step2- Checkout the source code
        uses: actions/checkout@v4

      - name: Step3- Checking the transferred code
        run: ls -al
      - name: mystep4- Build Docker image
        run: |
          docker image build -t sushiljajra/image_oct31:t${{ github.run_number }} -f Dockerfile .
      - name: mystep5- Check if the image is build success
        run: docker images
      - name: Step6- Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Step7- Push image to Docker Hub
        run: |
          docker image push sushiljajra/image_oct31:t${{ github.run_number }}
